#SUBSCRIBED https://raw.githubusercontent.com/YJTDW/my-shadowrocket-rules/main/Stash-Universal-Speed-Chain.yaml
#
# Stash 单链接动态链式配置
# 链路：Stash -> 动态优选机场节点 -> 洛杉矶固定 SOCKS5 -> Internet
# 节点新增/删除后由 proxy-provider 自动同步，不再生成逐节点 relay。

mode: rule
log-level: info
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
external-controller: "127.0.0.1:9090"

dns:
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  follow-rule: false
  skip-cert-verify: false
  nameserver-policy:
    "geosite:cn":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.localhost"
    - "+.home.arpa"
    - "captive.apple.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"

proxy-providers:
  机场订阅:
    url: "https://dash.pqjc.site/api/v1/pq/92528fda166b6184854b1bceb8739374"
    path: "./providers/airport-dynamic.yaml"
    interval: 1800
    headers:
      User-Agent: "Stash/3.4.0"
      Accept: "application/yaml,text/yaml,text/plain,*/*"

proxies:
  - name: "🏁洛杉矶固定出口"
    type: socks5
    server: "207.97.139.109"
    port: 443
    username: "fXaEWJpRKeAp"
    password: "eTzA9SVbZ1"
    udp: true
    dialer-proxy: "🎛链式前置选择"
    benchmark-url: "http://www.apple.com/library/test/success.html"
    benchmark-timeout: 5

proxy-groups:
  # 平时只使用这个总入口。
  - name: "🚀节点选择"
    type: select
    proxies:
      - "🔗洛杉矶智能链"
      - DIRECT

  # 最终出口始终为洛杉矶固定 SOCKS5。
  - name: "🔗洛杉矶智能链"
    type: select
    proxies:
      - "🏁洛杉矶固定出口"

  # 测速脚本会把本组切换到综合得分最高的机场节点。
  - name: "🎛链式前置选择"
    type: select
    proxies:
      - "⚡前置延迟自动"
    use:
      - 机场订阅

  # 当真实测速尚未完成或失败时，自动使用最低延迟节点兜底。
  - name: "⚡前置延迟自动"
    type: url-test
    use:
      - 机场订阅
    url: "http://www.apple.com/library/test/success.html"
    interval: 300
    tolerance: 50
    lazy: false

script-providers:
  链式综合测速:
    url: "https://raw.githubusercontent.com/YJTDW/my-shadowrocket-rules/main/Stash-Chain-Auto-Speed.js"
    interval: 86400
    headers:
      Accept: "application/javascript,text/plain,*/*"

# 首页面板会按周期运行；也可以在 Stash 的脚本/定时任务页面手动执行。
tiles:
  - name: 链式综合测速
    interval: 21600
    title: "链式测速等待运行"
    content: "延迟初筛 + 完整链路下载测速"
    icon: "gauge.with.dots.needle.67percent"
    backgroundColor: "#2563EB"

cron:
  script:
    - name: 链式综合测速
      cron: "5 */6 * * *"
      timeout: 180

rule-providers:
  merged-proxy-domain:
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/proxy.txt"
    path: "./rules/merged-proxy-domain.txt"
    interval: 86400

  merged-tld-not-cn:
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/tld-not-cn.txt"
    path: "./rules/merged-tld-not-cn.txt"
    interval: 86400

  merged-proxy-classical:
    behavior: classical
    format: text
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Proxy/Proxy.list"
    path: "./rules/merged-proxy-classical.txt"
    interval: 86400

  merged-cn-domain:
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list"
    path: "./rules/merged-cn-domain.txt"
    interval: 86400

  merged-cn-classical:
    behavior: classical
    format: text
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaMax/ChinaMax.list"
    path: "./rules/merged-cn-classical.txt"
    interval: 86400

  merged-cn-ip:
    behavior: classical
    format: text
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaIPs/ChinaIPs.list"
    path: "./rules/merged-cn-ip.txt"
    interval: 86400

rules:
  # 防 WebRTC/STUN 泄露并关闭 QUIC。
  - "PROTOCOL,STUN,REJECT-DROP,no-track"
  - "PROTOCOL,QUIC,REJECT,no-track"

  # 本地与保留地址直连。
