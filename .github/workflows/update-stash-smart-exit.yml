name: Update Stash smart exit

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml requests

      - name: Regenerate opt-in smart exit override
        run: python tools/generate_stash_smart_exit.py

      - name: Commit updated node snapshot
        run: |
          if git diff --quiet -- Stash-Universal-Speed-Chain.stoverride; then
            echo "No node changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Stash-Universal-Speed-Chain.stoverride
          git commit -m "Update Stash smart exit nodes"
          git push
