# Manual Merge override: IPv4-only, DNS leak resistant, STUN reject and strict TUN routing.
# 企业级跨平台客户端与服务端标准配置模板库 - Clash 规则覆写合并配置

proxies: []
ipv6: false
tcp-concurrent: true
unified-delay: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "localhost"
    - "+.home.arpa"
    - "time.*"
    - "ntp.*"
    - "+.pool.ntp.org"
    - "*.apple.com"
    - "*.apple.co"
    - "*.appstore.com"
    - "*.icloud.com"
    - "*.icloud-content.com"
    - "*.cdn-apple.com"
    - "*.mzstatic.com"
    - "*.aaplimg.com"
    - "*.swcdn.apple.com"
    - "*.me.com"
    - "*.apple-cloudkit.com"
    - "*.apple-livephotoskit.com"
    - "*.apple-mapkit.com"
    - "captive.apple.com"
    - "*.wechat.com"
    - "*.weixin.com"
    - "*.servicewechat.com"
    - "*.qq.com"
    - "*.qpic.cn"
    - "*.qlogo.cn"
    - "*.gtimg.com"
    - "*.cn"
    - "*.xn--fiqs8s"
    - "*.xn--fiqz9s"
    - "*.xn--55qx5d"
    - "*.qihangjiaoyu.com"
    - "*.polyv.net"
    - "*.polyv.cn"
    - "*.alicdn.com"
    - "*.msftncsi.com"
